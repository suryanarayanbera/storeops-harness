server:
  port: 8080

spring:
  application:
    name: storeops-api

  # H2 in-memory. DB_CLOSE_DELAY=-1 keeps the database alive for the whole JVM lifetime rather
  # than dropping it when the first connection closes.
  datasource:
    url: jdbc:h2:mem:storeops;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: storeops
    password: ""

  # Browse the tables at http://localhost:8080/h2-console
  # JDBC URL: jdbc:h2:mem:storeops   User: storeops   Password: (blank)
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      # Schema is created from the @Entity classes on startup and dropped on shutdown.
      ddl-auto: create-drop
    # Required so data.sql runs AFTER Hibernate has created the schema, not before.
    defer-datasource-initialization: true
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always

  jackson:
    # Instants as ISO-8601 strings rather than epoch numbers, so responses are readable in curl.
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  mvc:
    problemdetails:
      # Off deliberately: GlobalExceptionHandler owns the error body shape
      # (code, message, statusCode, path, timestamp).
      enabled: false

# StoreOps feature configuration. Each module configures its own knobs; neither sets the other's
# timing.
storeops:
  activities:
    sla:
      # Delay between overdue sweeps, once the first one has run.
      sweep-interval: PT5M
      # Deliberately longer than any test run. @EnableScheduling is active in every @SpringBootTest,
      # so a short first delay would let a sweep fire mid-test and raise alerts that test never asked
      # for. Tests call TaskService.publishOverdueBreaches() directly instead.
      initial-delay: PT10M
      sweep:
        # Set false to remove the scheduler bean entirely, in an environment that must not alert.
        enabled: true
  alerts:
    sla:
      # How long a breach may go unresolved before it escalates from the department lead to the store
      # manager, measured from the first observed breach. Absent or negative falls back to PT2H.
      grace-period: PT2H

logging:
  level:
    root: INFO
    com.cognizant.storeops: DEBUG
