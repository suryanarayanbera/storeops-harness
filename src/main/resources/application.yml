server:
  port: 8080

spring:
  application:
    name: storeops-api

  # H2 in-memory. DB_CLOSE_DELAY=-1 keeps the database alive for the whole JVM lifetime rather
  # than dropping it when the first connection closes.
  datasource:
    url: jdbc:h2:mem:storeops;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: storeops
    password: ""

  # Browse the tables at http://localhost:8080/h2-console
  # JDBC URL: jdbc:h2:mem:storeops   User: storeops   Password: (blank)
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      # Schema is created from the @Entity classes on startup and dropped on shutdown.
      ddl-auto: create-drop
    # Required so data.sql runs AFTER Hibernate has created the schema, not before.
    defer-datasource-initialization: true
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always

  jackson:
    # Instants as ISO-8601 strings rather than epoch numbers, so responses are readable in curl.
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  mvc:
    problemdetails:
      # Off deliberately: GlobalExceptionHandler owns the error body shape
      # (code, message, statusCode, path, timestamp).
      enabled: false

storeops:
  activities:
    sla:
      # Clock-driven SLA breach detection. The sweep restates the fact that an activity is still
      # overdue on every cycle; the alerts module de-duplicates. Disabled in the integration tests
      # so a sweep cannot insert notifications mid-test - see SlaSweepScheduler.
      sweep:
        enabled: true
        interval: PT15M
        # Also 15 minutes so the first sweep cannot fire inside a test run, which is the second half
        # of the isolation guarantee: the property above is the first.
        initial-delay: PT15M
  alerts:
    sla:
      # How long a breach may stay unresolved before the store manager is told. Owned by alerts, not
      # activities: how long anyone has to act on a breach is an alerting policy. Zero is legal and
      # means "escalate on the next sweep".
      grace-period: PT4H

logging:
  level:
    root: INFO
    com.cognizant.storeops: DEBUG
